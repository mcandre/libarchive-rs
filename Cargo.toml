[workspace]
members = [".", "libarchive2-sys"]
resolver = "2"

[package]
name = "xarxarxar"
version = "0.2.2"
edition = "2024"
description = "fork of libarchive2 with CPIO ODC + XAR patches"
license = "BSD-2-Clause"
repository = "https://github.com/mcandre/libarchive-rs"
documentation = "https://docs.rs/xarxarxar"
keywords = ["archive", "compression", "tar", "zip", "libarchive"]
categories = ["compression", "filesystem", "encoding"]
readme = "README.md"

[dependencies]
libarchive2-sys = { version = "0.2.0", path = "libarchive2-sys" }
libc = "0.2"
lzma-rs = "0.3"

[dev-dependencies]
tempfile = "3.8"
